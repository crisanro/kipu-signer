services:
  signer-node:
    build: .
    container_name: kipu_signer_node
    # Sin "ports": solo accesible desde la red interna (el backend usa
    # http://kipu_signer_node:3000). Además exige X-Signer-Key si SIGNER_API_KEY está definida.
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Mismo valor que SIGNER_API_KEY en el .env de kipu-core1. Se toma de las
      # variables del proyecto en Dokploy; vacía = el firmador no exige clave.
      - SIGNER_API_KEY=${SIGNER_API_KEY:-}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M       # Margen para generar PDFs (RIDE)
        reservations:
          memory: 128M
    networks:
      - red_infraestructura

networks:
  red_infraestructura:
    external: true