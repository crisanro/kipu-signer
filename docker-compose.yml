version: '3.8'

services:
  signer-node:
    build: .
    container_name: kipu_signer_node
    # Sin "ports": el servicio no tiene autenticación, así que solo debe ser
    # accesible desde la red interna (el backend usa http://kipu_signer_node:3000).
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: always
    networks:          # ← mismo nivel que ports, volumes, etc.
      - red_infraestructura

networks:
  red_infraestructura:
    external: true
